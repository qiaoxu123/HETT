[pytest]
# The repo is used as a source tree, not an installed distribution: modules are
# imported as top-level packages (`multiagent`, `vlnce`, ...) with the repo root
# as the base.  There are no __init__.py files and no conftest.py at the root,
# so pytest's rootdir is never added to sys.path and a plain
# `pytest tests/...` run fails at collection with "No module named 'multiagent'".
# Pinning the root on sys.path here keeps the documented invocation working.
pythonpath = .
