name: Heatmap multi-landmark regression

on:
  push:
    branches:
      - '2027-CVPR/heatmap-sbf-relative-geometry-top20'
      - '2027-CVPR/hett-heatmap-multitrajectory'
      - '2027-CVPR/heatmap-joint-goal-trajectory'
      - '2027-CVPR/heatmap-joint-goal-trajectory-fixes'
      - '2027-CVPR/hett-layered-fastpath'
  pull_request:
    paths:
      - 'multiagent/models/multi_landmark.py'
      - 'multiagent/models/relative_geometry.py'
      - 'multiagent/models/spatial_belief.py'
      - 'tests/test_*landmark*.py'
      - 'tests/test_heatmap_relative_geometry.py'
      - 'tests/test_dense_spatial_belief.py'
      - 'multiagent/models/heatmap_trajectory.py'
      - 'multiagent/models/candidate_relation_selector.py'
      - 'tests/test_heatmap_trajectory.py'
      - 'tests/test_candidate_relation_selector.py'
      - 'tests/test_joint_trajectory_selection.py'
      - 'tests/test_joint_rollout_accounting.py'
      - 'tests/test_layered_fastpath.py'
      - 'multiagent/static_observation.py'
      - 'multiagent/maps/landmark_nav_map.py'
      - '.github/workflows/heatmap-multilandmark-tests.yml'

permissions:
  contents: read

jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU PyTorch and pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pytest numpy shapely
      - name: Compile modified Python files
        run: |
          python -m py_compile multiagent/models/candidate_relation_selector.py multiagent/models/heatmap_trajectory.py multiagent/models/multi_landmark.py multiagent/models/relative_geometry.py multiagent/models/spatial_belief.py multiagent/models/ET_haa.py multiagent/agent.py multiagent/env.py multiagent/main.py multiagent/parser.py multiagent/trajectory_rollout_utils.py multiagent/static_observation.py multiagent/maps/landmark_nav_map.py scripts/joint_experiment_metrics.py scripts/run_joint_goal_trajectory_experiment.py scripts/continue_joint_goal_trajectory_run.py scripts/evaluate_joint_goal_trajectory_checkpoint.py
      - name: Run regression tests
        run: |
          python -m pytest -q tests/test_candidate_relation_selector.py tests/test_joint_trajectory_selection.py tests/test_joint_rollout_accounting.py tests/test_layered_fastpath.py tests/test_heatmap_trajectory.py tests/test_multi_landmark_relations.py tests/test_heatmap_relative_geometry.py tests/test_dense_spatial_belief.py
