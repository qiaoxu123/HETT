name: Heatmap multi-landmark regression

on:
  push:
    branches:
      - '2027-CVPR/heatmap-sbf-relative-geometry-top20'
      - '2027-CVPR/hett-heatmap-multitrajectory'
      - '2027-CVPR/heatmap-joint-goal-trajectory'
  pull_request:
    paths:
      - 'multiagent/models/multi_landmark.py'
      - 'multiagent/models/relative_geometry.py'
      - 'multiagent/models/spatial_belief.py'
      - 'tests/test_*landmark*.py'
      - 'tests/test_heatmap_relative_geometry.py'
      - 'tests/test_dense_spatial_belief.py'
      - 'multiagent/models/heatmap_trajectory.py'
      - 'tests/test_heatmap_trajectory.py'
      - '.github/workflows/heatmap-multilandmark-tests.yml'

permissions:
  contents: read

jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU PyTorch and pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pytest numpy
      - name: Compile modified Python files
        run: |
          python -m py_compile multiagent/models/heatmap_trajectory.py multiagent/models/multi_landmark.py multiagent/models/relative_geometry.py multiagent/models/spatial_belief.py multiagent/models/ET_haa.py multiagent/agent.py multiagent/env.py multiagent/main.py multiagent/parser.py
      - name: Run regression tests
        run: |
          python -m pytest -q tests/test_heatmap_trajectory.py tests/test_multi_landmark_relations.py tests/test_heatmap_relative_geometry.py tests/test_dense_spatial_belief.py
